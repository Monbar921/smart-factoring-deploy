# Стенд smart-factoring (test или prod): backend + gateway + ui.
# Переменные берутся из .env рядом с файлом: на VDS его пишет deploy workflow, локально - копия .env.example
#
# Postgres и keycloak общие для всех стендов и раскатываются отдельно (infra/docker-compose.yml, workflow infra.yml):
# backend ходит в postgres через сеть smart-factoring-db, у стенда в нём своя база и свой пользователь;
# gateway берёт ключи подписи токенов у keycloak через сеть smart-factoring-auth, у стенда в нём свой realm.
#
# Снаружи доступны ui и gateway; backend - только внутри сети стенда:
#   браузер -> ui :UI_PORT (nginx: статика, /api -> gateway) -> gateway:GATEWAY_PORT -> backend:BACKEND_PORT
#   клиент  -> gateway :GATEWAY_PORT -> backend:BACKEND_PORT -> postgres:5432 (сеть smart-factoring-db)
# Порты приложений задаются через SERVER_PORT: Spring Boot берёт его вместо server.port из application.yml
name: ${COMPOSE_PROJECT_NAME:-smart-factoring}

services:
  backend:
    image: ghcr.io/monbar921/smart-factoring-backend:${BACKEND_TAG:?BACKEND_TAG is required}
    restart: unless-stopped
    # в образе нет ENTRYPOINT, команда запуска задаётся здесь
    command: [ "java", "-XX:MaxRAMPercentage=75.0", "-jar", "app.jar" ]
    # postgres в другом compose-проекте, depends_on на него невозможен:
    # если он недоступен, backend падает на старте и перезапускается (restart: unless-stopped)
    networks:
      - default
      - db
    environment:
      # подставляются в ${...} в application.yml backend.
      # ':-' в compose подставляет значение и для пустой переменной: пустая строка в Spring перекрыла бы его default
      POSTGRES_JDBC: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?socketTimeout=60
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:?POSTGRES_SCHEMA is required}
      POSTGRES_POOL: ${POSTGRES_POOL:-smart_factoring_backend}
      SERVER_PORT: ${BACKEND_PORT:-8080}
      # LLM: stub - шаблонные тексты без LLM, gigachat - GigaChat API, off - без черновика сообщения клиенту
      LLM_MODE: ${LLM_MODE:-stub}
      # ключ авторизации GigaChat API (Base64 client_id:client_secret), нужен только при LLM_MODE=gigachat
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      # сертификаты GigaChat выданы НУЦ Минцифры, которого нет в JDK: корневой и выпускающие - из ./certs
      GIGACHAT_CA_CERT: /certs/russian_trusted_root_ca.pem
    volumes:
      - ./certs:/certs:ro
    # куча JVM - 75% от mem_limit (MaxRAMPercentage), число потоков GC/пулов JVM считает от cpus
    cpus: ${BACKEND_CPUS:-1}
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/actuator/health | grep -q UP" ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  gateway:
    image: ghcr.io/monbar921/smart-factoring-gateway:${GATEWAY_TAG:?GATEWAY_TAG is required}
    restart: unless-stopped
    command: [ "java", "-XX:MaxRAMPercentage=75.0", "-jar", "app.jar" ]
    # backend нужен gateway только при проксировании, не при старте: пока backend поднимается, gateway отвечает 5xx
    depends_on:
      backend:
        condition: service_started
    environment:
      # подставляется в ${...} в application.yml gateway
      BACKEND_URI: http://backend:${BACKEND_PORT:-8080}
      SERVER_PORT: ${GATEWAY_PORT:-8090}
      # iss токенов realm стенда - публичный адрес keycloak, тот же, что видит браузер
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL is required}/realms/${KEYCLOAK_REALM:?KEYCLOAK_REALM is required}
      # ключи подписи - напрямую из keycloak по сети smart-factoring-auth
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
    networks:
      - default
      - auth
    # gateway слушает тот же порт, что и публикуется на VDS
    ports:
      - "${GATEWAY_PORT:-8090}:${GATEWAY_PORT:-8090}"
    cpus: ${GATEWAY_CPUS:-0.5}
    mem_limit: ${GATEWAY_MEM_LIMIT:-512m}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/actuator/health | grep -q UP" ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  ui:
    image: ghcr.io/monbar921/smart-factoring-ui:${UI_TAG:?UI_TAG is required}
    restart: unless-stopped
    # nginx находит gateway через DNS docker при каждом запросе: стартует и без него, пока gateway поднимается - 502
    depends_on:
      gateway:
        condition: service_started
    environment:
      SERVER_PORT: ${UI_PORT:-8070}
      # /api проксируется в gateway по сети стенда: UI и API на одном origin, CORS не нужен
      GATEWAY_URI: http://gateway:${GATEWAY_PORT:-8090}
      # пишутся в config.js для браузера: вход пользователя на странице keycloak realm стенда
      KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL is required}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM is required}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_UI_CLIENT_ID:-smart-factoring-ui}
    ports:
      - "${UI_PORT:-8070}:${UI_PORT:-8070}"
    cpus: ${UI_CPUS:-0.25}
    mem_limit: ${UI_MEM_LIMIT:-128m}
    # localhost в alpine - сначала ::1, а nginx слушает только IPv4
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:$${SERVER_PORT}/healthz | grep -q UP" ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

networks:
  # создаётся infra/docker-compose.yml: сначала раскатить infra, потом стенды
  db:
    external: true
    name: smart-factoring-db
  auth:
    external: true
    name: smart-factoring-auth
