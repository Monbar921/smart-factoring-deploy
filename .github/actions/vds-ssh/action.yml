name: Setup VDS SSH
description: >-
  Настраивает на раннере ssh-подключение к VDS под именем хоста "vds":
  ключ деплоя, known_hosts со строгой проверкой ключа сервера.

inputs:
  host:
    description: адрес VDS
    required: true
  user:
    description: пользователь на VDS
    required: true
  ssh-key:
    description: приватный ключ деплоя
    required: true
  known-hosts:
    description: вывод ssh-keyscan для VDS ("<host> ssh-ed25519 AAAA...") или только ключ сервера
    required: true

runs:
  using: composite
  steps:
    - name: Setup SSH
      shell: bash
      env:
        VDS_HOST: ${{ inputs.host }}
        VDS_USER: ${{ inputs.user }}
        VDS_SSH_KEY: ${{ inputs.ssh-key }}
        VDS_KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$VDS_SSH_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy

        # пробелы и переводы строк по краям секретов при вставке в GitHub - частая причина ошибок
        host="$(printf '%s' "$VDS_HOST" | tr -d '[:space:]')"
        user="$(printf '%s' "$VDS_USER" | tr -d '[:space:]')"

        # строке без адреса ("ssh-ed25519 AAAA...") подставляется VDS_HOST, комментарии пропускаются
        printf '%s\n' "$VDS_KNOWN_HOSTS" | tr -d '\r' | while read -r line; do
          case "$line" in
            ''|'#'*) ;;
            ssh-*|ecdsa-*|sk-*) printf '%s %s\n' "$host" "$line" ;;
            *) printf '%s\n' "$line" ;;
          esac
        done > ~/.ssh/known_hosts

        if ! ssh-keygen -F "$host" -f ~/.ssh/known_hosts > /dev/null; then
          echo "::error::В VDS_KNOWN_HOSTS нет ключа для адреса из VDS_HOST. Нужна строка из 'ssh-keyscan -t ed25519 <VDS_HOST>' целиком."
          echo "Ключи в VDS_KNOWN_HOSTS (адреса скрыты GitHub, отпечатки публичные):"
          ssh-keygen -lf ~/.ssh/known_hosts || echo "  не удалось разобрать ни одной строки"
          # само содержимое не печатаем, только что за строки лежат в секрете
          echo "Строки VDS_KNOWN_HOSTS:"
          n=0
          printf '%s\n' "$VDS_KNOWN_HOSTS" | tr -d '\r' | while read -r first second _; do
            n=$((n + 1))
            case "$first" in
              '') kind="пустая" ;;
              '#'*) kind="комментарий (пропущена)" ;;
              ssh-*|ecdsa-*|sk-*) kind="ключ без адреса, тип $first" ;;
              SHA256:*|MD5:*|256|384|521|3072|4096) kind="отпечаток, а не ключ" ;;
              -----BEGIN*) kind="приватный ключ - его место в VDS_SSH_KEY, а не здесь" ;;
              *)
                case "$second" in
                  ssh-*|ecdsa-*|sk-*) kind="адрес + ключ типа $second, но адрес не совпал с VDS_HOST" ;;
                  *) kind="не ключ (например, сообщение об ошибке ssh-keyscan)" ;;
                esac ;;
            esac
            echo "  $n: $kind"
          done
          exit 1
        fi

        cat > ~/.ssh/config <<EOF
        Host vds
          HostName $host
          User $user
          IdentityFile ~/.ssh/id_deploy
          IdentitiesOnly yes
          StrictHostKeyChecking yes
        EOF
