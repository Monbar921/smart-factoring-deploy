name: Deploy

# Раскатка docker-compose.yml на VDS.
#   repository_dispatch (event_type: deploy) - из CI/CD smart-factoring-backend / smart-factoring-gateway
#                                              после сборки образа,
#                                              client_payload: { service, branch, image, tag, digest, sha }
#   workflow_dispatch                        - ручной деплой/откат: окружение + сервис (или "все") + тег образа
#
# Ветка сервиса -> окружение: main -> prod, всё остальное -> test.
# Обновляется тег только пришедшего сервиса, тег второго берётся из текущего .env на VDS
# (если стенд ещё пустой - тег ветки окружения: test или main).
# Postgres общий для стендов и раскатывается отдельно (workflow infra.yml) - здесь только база/пользователь стенда.
# Адрес и пользователь VDS - переменные репозитория, ключи - секреты репозитория,
# настройки стенда - в GitHub Environments test/prod, см. README.md
on:
  repository_dispatch:
    types: [ deploy ]
  workflow_dispatch:
    inputs:
      environment:
        description: Окружение
        type: choice
        options: [ test, prod ]
        default: test
      service:
        description: Сервис ("все" - backend и gateway с одним тегом, например test или main)
        type: choice
        options: [ backend, gateway, все ]
        default: backend
      tag:
        description: Тег образа (short sha, test, main)
        required: true
        default: test

permissions:
  contents: read

jobs:
  target:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      service: ${{ steps.resolve.outputs.service }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      # значения из payload/inputs идут только через env и проверяются, в shell не подставляются напрямую
      - name: Resolve environment, service and tag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          PAYLOAD_SERVICE: ${{ github.event.client_payload.service }}
          PAYLOAD_BRANCH: ${{ github.event.client_payload.branch }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = "repository_dispatch" ]; then
            if [ "$PAYLOAD_BRANCH" = "main" ]; then environment=prod; else environment=test; fi
            service="${PAYLOAD_SERVICE#smart-factoring-}"
            tag="$PAYLOAD_TAG"
          else
            environment="$INPUT_ENVIRONMENT"
            service="$INPUT_SERVICE"
            tag="$INPUT_TAG"
          fi
          case "$service" in
            backend|gateway) ;;
            все) service=all ;;
            *) echo "::error::Неизвестный сервис: '$service'"; exit 1 ;;
          esac
          if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Некорректный тег образа: '$tag'"
            exit 1
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$service" = "all" ]; then name="smart-factoring-{backend,gateway}"; else name="smart-factoring-$service"; fi
          echo "Deploy $name:$tag -> $environment" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ needs.target.outputs.service }} to ${{ needs.target.outputs.environment }}
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.target.outputs.environment }}
    # деплои в одно окружение идут строго по очереди, начатый не прерывается:
    # иначе два сервиса одновременно перезаписали бы .env друг друга
    concurrency:
      group: deploy-${{ needs.target.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      # GITHUB_TOKEN этого репозитория используется на VDS для docker login в ghcr.io на время pull
      packages: read

    env:
      ENVIRONMENT: ${{ needs.target.outputs.environment }}
      SERVICE: ${{ needs.target.outputs.service }}
      SERVICE_TAG: ${{ needs.target.outputs.tag }}
      VDS_HOST: ${{ vars.VDS_HOST }}
      VDS_USER: ${{ vars.VDS_USER }}
      VDS_DIR: ${{ vars.VDS_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check configuration
        env:
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_KNOWN_HOSTS: ${{ secrets.VDS_KNOWN_HOSTS }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_SCHEMA: ${{ vars.POSTGRES_SCHEMA }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
        run: |
          missing=""
          for name in VDS_HOST VDS_USER VDS_SSH_KEY VDS_KNOWN_HOSTS VDS_DIR POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD POSTGRES_SCHEMA; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::В окружении $ENVIRONMENT не заданы:$missing"
            exit 1
          fi

      - name: Setup SSH
        uses: ./.github/actions/vds-ssh
        with:
          host: ${{ vars.VDS_HOST }}
          user: ${{ vars.VDS_USER }}
          ssh-key: ${{ secrets.VDS_SSH_KEY }}
          known-hosts: ${{ secrets.VDS_KNOWN_HOSTS }}

      # тег пришедшего сервиса (при "все" - всех) - из dispatch/запуска, остальных - как сейчас на стенде
      - name: Resolve image tags
        id: tags
        run: |
          current="$(ssh vds "cat '$VDS_DIR/.env' 2>/dev/null" || true)"
          if [ "$ENVIRONMENT" = "prod" ]; then branch_tag=main; else branch_tag=test; fi
          for service in backend gateway; do
            key="${service^^}_TAG"
            if [ "$SERVICE" = "all" ] || [ "$service" = "$SERVICE" ]; then
              tag="$SERVICE_TAG"
            else
              tag="$(printf '%s\n' "$current" | sed -n "s/^${key}=//p" | tail -n 1)"
              tag="${tag:-$branch_tag}"
            fi
            if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Некорректный $key на стенде: '$tag'"
              exit 1
            fi
            echo "${service}=${tag}" >> "$GITHUB_OUTPUT"
            echo "- smart-factoring-${service}: \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done

      # до любых изменений на VDS: иначе .env с несуществующим тегом остаётся на стенде,
      # и следующий деплой другого сервиса возьмёт этот тег оттуда
      - name: Check images exist
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_TAG: ${{ steps.tags.outputs.backend }}
          GATEWAY_TAG: ${{ steps.tags.outputs.gateway }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin > /dev/null
          missing=0
          for image in "smart-factoring-backend:$BACKEND_TAG" "smart-factoring-gateway:$GATEWAY_TAG"; do
            if docker manifest inspect "ghcr.io/monbar921/$image" > /dev/null 2>&1; then
              echo "ok: $image"
            else
              echo "::error::Образ ghcr.io/monbar921/$image не найден или нет доступа (Manage Actions access пакета)"
              missing=1
            fi
          done
          docker logout ghcr.io > /dev/null
          exit $missing

      - name: Check infra is deployed
        run: |
          if ! ssh vds "docker network inspect smart-factoring-db > /dev/null 2>&1"; then
            echo "::error::На VDS нет сети smart-factoring-db: сначала раскатите общий postgres (Actions → Infra → Run workflow)"
            exit 1
          fi

      - name: Render .env
        env:
          BACKEND_TAG: ${{ steps.tags.outputs.backend }}
          GATEWAY_TAG: ${{ steps.tags.outputs.gateway }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_SCHEMA: ${{ vars.POSTGRES_SCHEMA }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_POOL: ${{ vars.POSTGRES_POOL }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          BACKEND_CPUS: ${{ vars.BACKEND_CPUS }}
          BACKEND_MEM_LIMIT: ${{ vars.BACKEND_MEM_LIMIT }}
          GATEWAY_PORT: ${{ vars.GATEWAY_PORT }}
          GATEWAY_CPUS: ${{ vars.GATEWAY_CPUS }}
          GATEWAY_MEM_LIMIT: ${{ vars.GATEWAY_MEM_LIMIT }}
        run: |
          # ошибки в переменных окружения ловим здесь, а не на VDS: число без единицы в mem_limit - это байты
          invalid=""
          check() { [ -z "${!1}" ] || [[ "${!1}" =~ $2 ]] || invalid="$invalid $1='${!1}' ($3);"; }
          for name in BACKEND_MEM_LIMIT GATEWAY_MEM_LIMIT; do
            check "$name" '^[0-9]+[kKmMgG]$' "нужна единица: 512m, 1g"
          done
          for name in BACKEND_CPUS GATEWAY_CPUS; do
            check "$name" '^[0-9]+(\.[0-9]+)?$' "число ядер: 1, 0.5"
          done
          for name in BACKEND_PORT GATEWAY_PORT; do
            check "$name" '^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$' "порт 1-65535"
          done
          if [ -n "$invalid" ]; then
            echo "::error::Некорректные переменные окружения $ENVIRONMENT:$invalid"
            exit 1
          fi

          umask 077
          {
            echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-smart-factoring-${ENVIRONMENT}}"
            echo "BACKEND_TAG=${BACKEND_TAG}"
            echo "BACKEND_PORT=${BACKEND_PORT:-8080}"
            echo "BACKEND_CPUS=${BACKEND_CPUS:-1}"
            echo "BACKEND_MEM_LIMIT=${BACKEND_MEM_LIMIT:-1g}"
            echo "GATEWAY_TAG=${GATEWAY_TAG}"
            echo "GATEWAY_PORT=${GATEWAY_PORT:-8090}"
            echo "GATEWAY_CPUS=${GATEWAY_CPUS:-0.5}"
            echo "GATEWAY_MEM_LIMIT=${GATEWAY_MEM_LIMIT:-512m}"
            echo "POSTGRES_USER='${POSTGRES_USER}'"
            echo "POSTGRES_PASSWORD='${POSTGRES_PASSWORD}'"
            echo "POSTGRES_SCHEMA='${POSTGRES_SCHEMA}'"
            # пустое значение compose заменит на smart_factoring_backend
            echo "POSTGRES_POOL='${POSTGRES_POOL}'"
            echo "POSTGRES_DB='${POSTGRES_DB}'"
          } > deploy.env

      - name: Upload files
        run: |
          ssh vds "mkdir -p '$VDS_DIR'"
          scp docker-compose.yml vds:"$VDS_DIR/docker-compose.yml"
          scp deploy.env vds:"$VDS_DIR/.env"
          ssh vds "chmod 600 '$VDS_DIR/.env'"

      - name: Pull and start
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # токен живёт только пока идёт job, после pull сразу logout
          printf '%s' "$GHCR_TOKEN" | ssh vds "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh vds "cd '$VDS_DIR' && docker compose pull; rc=\$?; docker logout ghcr.io; exit \$rc"
          ssh vds "cd '$VDS_DIR' && docker compose up -d --remove-orphans --wait --wait-timeout 180"

      - name: Status
        if: always()
        run: |
          ssh vds "cd '$VDS_DIR' && docker compose ps" || true
          if [ "$SERVICE" = "all" ]; then services=""; else services="$SERVICE"; fi
          ssh vds "cd '$VDS_DIR' && docker compose logs --tail 100 $services" || true

      - name: Cleanup old images
        if: success()
        run: ssh vds "docker image prune -f --filter 'until=168h'"
