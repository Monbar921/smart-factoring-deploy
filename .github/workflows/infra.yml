name: Infra

# Раскатка общей инфраструктуры VDS (infra/docker-compose.yml: postgres на все стенды).
#   push в main с изменениями infra/** - автоматически
#   workflow_dispatch                  - вручную
#
# Адрес и пользователь VDS - переменные репозитория, ключи и пароль администратора - секреты репозитория.
# Администратор, лимиты и каталог postgres берутся из Environment test: postgres один на все стенды,
# его настройки живут рядом с настройками test. См. README.md
on:
  push:
    branches: [ "main" ]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/actions/vds-ssh/**"
  workflow_dispatch:

permissions:
  contents: read

# перезапуск postgres посреди другого перезапуска postgres ни к чему
concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: test

    env:
      # если не задан - каталог infra рядом с каталогом стенда test: /home/deploy/smart-factoring/test -> .../infra
      VDS_INFRA_DIR: ${{ vars.VDS_INFRA_DIR }}
      VDS_DIR: ${{ vars.VDS_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check configuration
        env:
          VDS_HOST: ${{ vars.VDS_HOST }}
          VDS_USER: ${{ vars.VDS_USER }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_KNOWN_HOSTS: ${{ secrets.VDS_KNOWN_HOSTS }}
          POSTGRES_USER_ADMIN: ${{ vars.POSTGRES_USER_ADMIN }}
          POSTGRES_PASSWORD_ADMIN: ${{ secrets.POSTGRES_PASSWORD_ADMIN }}
        run: |
          missing=""
          [ -n "$VDS_INFRA_DIR" ] || [ -n "$VDS_DIR" ] || missing=" VDS_INFRA_DIR (или VDS_DIR окружения test)"
          for name in VDS_HOST VDS_USER VDS_SSH_KEY VDS_KNOWN_HOSTS POSTGRES_USER_ADMIN POSTGRES_PASSWORD_ADMIN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы (репозиторий или Environment test):$missing"
            exit 1
          fi
          infra_dir="${VDS_INFRA_DIR:-$(dirname "$VDS_DIR")/infra}"
          echo "INFRA_DIR=$infra_dir" >> "$GITHUB_ENV"
          echo "Каталог infra на VDS: $infra_dir" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup SSH
        uses: ./.github/actions/vds-ssh
        with:
          host: ${{ vars.VDS_HOST }}
          user: ${{ vars.VDS_USER }}
          ssh-key: ${{ secrets.VDS_SSH_KEY }}
          known-hosts: ${{ secrets.VDS_KNOWN_HOSTS }}

      - name: Render .env
        env:
          POSTGRES_USER_ADMIN: ${{ vars.POSTGRES_USER_ADMIN }}
          POSTGRES_PASSWORD_ADMIN: ${{ secrets.POSTGRES_PASSWORD_ADMIN }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          POSTGRES_CPUS: ${{ vars.POSTGRES_CPUS }}
          POSTGRES_MEM_LIMIT: ${{ vars.POSTGRES_MEM_LIMIT }}
        run: |
          invalid=""
          check() { [ -z "${!1}" ] || [[ "${!1}" =~ $2 ]] || invalid="$invalid $1='${!1}' ($3);"; }
          check POSTGRES_MEM_LIMIT '^[0-9]+[kKmMgG]$' "нужна единица: 512m, 1g"
          check POSTGRES_CPUS '^[0-9]+(\.[0-9]+)?$' "число ядер: 1, 0.5"
          check POSTGRES_PORT '^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$' "порт 1-65535"
          if [ -n "$invalid" ]; then
            echo "::error::Некорректные переменные:$invalid"
            exit 1
          fi

          umask 077
          {
            echo "POSTGRES_USER_ADMIN='${POSTGRES_USER_ADMIN}'"
            echo "POSTGRES_PASSWORD_ADMIN='${POSTGRES_PASSWORD_ADMIN}'"
            echo "POSTGRES_PORT=${POSTGRES_PORT:-5432}"
            echo "POSTGRES_CPUS=${POSTGRES_CPUS:-1}"
            echo "POSTGRES_MEM_LIMIT=${POSTGRES_MEM_LIMIT:-512m}"
          } > infra.env

      - name: Upload files
        run: |
          ssh vds "mkdir -p '$INFRA_DIR'"
          scp infra/docker-compose.yml vds:"$INFRA_DIR/docker-compose.yml"
          scp infra.env vds:"$INFRA_DIR/.env"
          ssh vds "chmod 600 '$INFRA_DIR/.env'"

      # postgres пересоздаётся, только если изменились его настройки; данные в volume сохраняются
      - name: Pull and start
        run: |
          ssh vds "cd '$INFRA_DIR' && docker compose pull && docker compose up -d --remove-orphans --wait --wait-timeout 120"

      - name: Status
        if: always()
        run: |
          ssh vds "cd '$INFRA_DIR' && docker compose ps" || true
          ssh vds "cd '$INFRA_DIR' && docker compose logs --tail 50 postgres" || true
