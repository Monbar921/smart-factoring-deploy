name: Secret scan

# Проверка, что в репозиторий не попали пароли, ключи и токены (smart-factoring-backend: docs/security.md, Р-77).
# Каждый push и pull request: gitleaks по файлам репозитория (правила по умолчанию + исключения из .gitleaks.toml)
# и запрет на отслеживаемый .env. Красная проверка - секрет попал в git: убрать его, сменить сам секрет
# (он уже в истории публичного репозитория) и только потом чинить сборку.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Нет отслеживаемого .env
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env с настройками в git - git rm --cached .env, добавить в .gitignore, сменить пароли из него"
            exit 1
          fi

      - name: gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.28.0 \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose --exit-code 1
