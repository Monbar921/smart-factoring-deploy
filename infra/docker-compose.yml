# Общая инфраструктура VDS на все стенды (test, prod): postgres и keycloak.
# Раскатывается отдельно от стендов - workflow infra.yml; .env рядом с файлом пишет он же.
#
# Сети с фиксированными именами (в docker-compose.yml стендов они external):
#   smart-factoring-db   - postgres; в нём у каждого стенда своя база и пользователь, у keycloak - база keycloak
#   smart-factoring-auth - keycloak для gateway стендов (ключи подписи токенов), postgres оттуда не виден
name: smart-factoring-infra

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      # создаются только при первом запуске пустого volume
      POSTGRES_DB: public
      POSTGRES_USER: ${POSTGRES_USER_ADMIN:?POSTGRES_USER_ADMIN is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_ADMIN:?POSTGRES_PASSWORD_ADMIN is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # для IDE через ssh-туннель, наружу не публикуется
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    cpus: ${POSTGRES_CPUS:-1}
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    # с Docker Hub, а не quay.io: CDN quay.io с VDS отдаёт слои с таймаутами.
    # Тот же образ, что quay.io/keycloak/keycloak:26.8.1 - дайджест совпадает, закреплён им
    image: keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    restart: unless-stopped
    # --import-realm: realm-файлы из ./keycloak/realms импортируются, только если такого realm ещё нет
    command: [ "start", "--import-realm" ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # база и пользователь keycloak создаются workflow infra.yml (keycloak/init-db.sql) до старта keycloak
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER is required}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      # администратор master realm: создаётся только при первом старте на пустой базе
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      # публичный адрес: из него строятся страницы логина и iss токенов - один и тот же для браузера и gateway
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL is required}
      # gateway ходит за ключами по внутренней сети (http://keycloak:8080), а не через публичный адрес
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # админка - только через ssh-туннель: ssh -L 8180:127.0.0.1:<KEYCLOAK_PORT> ..., затем http://localhost:8180/admin
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_ADMIN_URL:-http://localhost:8180}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # подставляются в ${...} realm-файлов при импорте
      KEYCLOAK_TEST_USER: ${KEYCLOAK_TEST_USER:?KEYCLOAK_TEST_USER is required}
      KEYCLOAK_TEST_USER_PASSWORD: ${KEYCLOAK_TEST_USER_PASSWORD:?KEYCLOAK_TEST_USER_PASSWORD is required}
      KEYCLOAK_TEST_GATEWAY_URL: ${KEYCLOAK_TEST_GATEWAY_URL:?KEYCLOAK_TEST_GATEWAY_URL is required}
      KEYCLOAK_TEST_UI_URL: ${KEYCLOAK_TEST_UI_URL:?KEYCLOAK_TEST_UI_URL is required}
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    # страница логина открывается в браузере - порт публичный
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    cpus: ${KEYCLOAK_CPUS:-1}
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-1g}
    networks:
      - default
      - auth
    # в образе нет curl/wget: запрос к /health/ready на management-порту 9000 средствами bash.
    # Смотрим код ответа, а не тело: в теле "UP" есть и у отдельных проверок, пока общий статус ещё DOWN (503)
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf ''GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12

networks:
  # фиксированные имена без префикса проекта: по ним сети находят стенды
  default:
    name: smart-factoring-db
  auth:
    name: smart-factoring-auth

volumes:
  postgres-data:
    name: smart-factoring-postgres-data
